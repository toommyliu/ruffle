name: Test Rust

on:
  push:
    branches: [desktop]
  pull_request:
    branches: [desktop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FEATURES: lzma,jpegxr,imgtests
  TEST_OPTS: --workspace --locked --no-fail-fast -j 4
  CARGO_INCREMENTAL: '1'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  build:
    name: Test Rust / macos-15
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Read runner image version
        run: |
          version=$(jq -r '.[] | select(.group == "Runner Image").detail' ~/imagedata.json | sed -n 's/^Version: //p')
          echo "RUNNER_IMAGE_VERSION=${version:?}" >> "$GITHUB_ENV"

      - name: Cache Cargo output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ env.RUNNER_IMAGE_VERSION }}
          save-if: ${{ github.ref == 'refs/heads/desktop' }}

      - name: Install cargo nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests
        shell: bash
        env:
          RUFFLE_TEST_OPTS: "--compile-mode=compile-and-verify"
        run: cargo nextest run --profile ci --cargo-profile ci ${TEST_OPTS} --features ${FEATURES}

      - name: Upload images
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: swf_images_macos-15
          path: |
            tests*/**/*.actual*.png
            tests*/**/*.difference*.png
