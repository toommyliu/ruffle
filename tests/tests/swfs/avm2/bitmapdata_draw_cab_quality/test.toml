num_ticks = 1

# Outliers come from the top triangle due to MSAA,
# the bottom one should produce a lot more in case something's wrong.
[[image_comparisons.output.checks]]
filter = 'not(os = "windows")'
max_outliers = 80

# Windows CI renders with WARP, which rounds these cached bitmaps differently.
[[image_comparisons.output.checks]]
filter = 'os = "windows"'
max_outliers = 81

[player_options]
with_renderer = { optional = false, quality = "high" }
viewport_dimensions = { width = 160, height = 160, scale_factor = 1 }
